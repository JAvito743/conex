<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cableado HC-SR04 Paso a Paso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: banco de trabajo — lámina del circuito grande a la izquierda, ficha del paso a la derecha; en móvil se apilan */
:root{
  --bg:#f2f4f5; --surface:#ffffff; --ink:#14212b; --muted:#5c6b75; --line:#d8dfe3;
  --board:#122130; --accent:#1a8a8a; --accent-soft:#e0f1f0;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d151c; --surface:#15212b; --ink:#e3ecf0; --muted:#93a5b0; --line:#273846;
  --board:#081017; --accent:#4cc3be; --accent-soft:#163536; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d151c; --surface:#15212b; --ink:#e3ecf0; --muted:#93a5b0; --line:#273846;
  --board:#081017; --accent:#4cc3be; --accent-soft:#163536; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--board);color:#e8f1f4}
header .wrap{padding-block:26px 22px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#4cc3be}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4vw,36px);line-height:1.1;margin:8px 0 6px;text-wrap:balance}
header p{margin:0;color:#b9cbd3;max-width:64ch}
main .wrap{padding-block:20px 40px;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){main .wrap{grid-template-columns:1fr}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.svgbox{overflow-x:auto}
.svgbox svg{display:block;width:100%;min-width:620px;height:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:4px 4px 10px}
.btn{font:500 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.toggle input{accent-color:var(--accent);width:17px;height:17px}

.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.stepno{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.card h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:4px 0 12px;line-height:1.15;text-wrap:balance}
.conn{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px}
.conn .end{border:1.5px solid var(--ink);border-radius:8px;padding:8px 10px;font-family:var(--f-mono);font-size:13px;text-align:center;min-width:0;overflow-wrap:anywhere}
.conn .end.from{background:var(--board);color:#fff;border-color:var(--board)}
.conn .wire{width:46px;height:6px;border-radius:3px;background:var(--wc,var(--muted))}
.conn.many{grid-template-columns:1fr}
.desc{margin:0 0 10px}
.tip{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
.tip.warn{border-left-color:#d93b3b;background:color-mix(in srgb,#d93b3b 12%,transparent)}
.nav{display:flex;gap:8px;margin-top:14px}
.nav .btn{flex:1}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:14px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}
ol.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ol.list button{width:100%;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
ol.list button:hover{background:var(--accent-soft)}
ol.list button[aria-current="step"]{background:var(--accent-soft);font-weight:600}
ol.list .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;background:var(--line);color:var(--ink)}
ol.list .past .n{background:var(--accent);color:#fff}
ol.list .sw{width:22px;height:5px;border-radius:3px}
.listhead{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.checks{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.checks input{accent-color:var(--accent);width:18px;height:18px;margin-top:2px;flex:none}

/* SVG */
.el{transition:opacity .25s}
.future{opacity:0;pointer-events:none}
.past{opacity:.5}
.dim .past{opacity:.28}
.now{opacity:1;filter:drop-shadow(0 0 4px rgba(26,138,138,.85))}
.wirepath{fill:none;stroke-width:5;stroke-linecap:round}
.now .wirepath{stroke-dasharray:9 6;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-15}}
.target{fill:none;stroke:#1a8a8a;stroke-width:3;opacity:0}
.target.on{opacity:1;animation:ring 1s ease-in-out infinite alternate}
@keyframes ring{from{stroke-opacity:1}to{stroke-opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header><div class="wrap">
  <div class="eyebrow">Medidor de distancia · Arduino UNO + HC-SR04</div>
  <h1>Conexiones paso a paso</h1>
  <p>Cada paso agrega un componente o un cable. El elemento nuevo aparece resaltado y con la corriente en movimiento; lo que ya conectaste queda atenuado.</p>
</div></header>

<main><div class="wrap">
  <div class="stage">
    <div class="toolbar">
      <span class="toggle"><input type="checkbox" id="dimOld"><label for="dimOld">Atenuar más lo ya conectado</label></span>
      <span class="toggle"><input type="checkbox" id="showAll"><label for="showAll">Ver circuito completo</label></span>
    </div>
    <div class="svgbox">
      <svg id="svg" viewBox="0 0 900 580" role="img" aria-label="Protoboard y Arduino UNO con las conexiones del paso actual">
        <!-- Protoboard -->
        <rect x="40" y="36" width="820" height="300" rx="10" fill="#eef1f2" stroke="#b9c2c8"/>
        <line x1="60" y1="56" x2="840" y2="56" stroke="#d93b3b" stroke-width="2"/>
        <line x1="60" y1="84" x2="840" y2="84" stroke="#2f6fd6" stroke-width="2"/>
        <text x="48" y="60" font-size="12" fill="#d93b3b" font-family="IBM Plex Mono" font-weight="600">+</text>
        <text x="48" y="88" font-size="12" fill="#2f6fd6" font-family="IBM Plex Mono" font-weight="600">−</text>
        <rect x="56" y="228" width="788" height="12" fill="#d6dce0"/>
        <text x="450" y="237" font-size="9" fill="#7d8a94" text-anchor="middle" font-family="IBM Plex Mono">canal central</text>
        <g id="holes"></g>
        <g id="labels" font-family="IBM Plex Mono" font-size="9" fill="#7d8a94"></g>
        <!-- Arduino -->
        <g>
          <rect x="120" y="400" width="700" height="160" rx="12" fill="#0f6f7a"/>
          <rect x="140" y="412" width="660" height="40" rx="4" fill="#0b545d"/>
          <g id="header"></g>
          <rect x="132" y="500" width="70" height="46" rx="4" fill="#9aa5ab"/>
          <text x="167" y="527" font-size="11" text-anchor="middle" fill="#14212b" font-family="IBM Plex Mono">USB</text>
          <rect x="470" y="490" width="150" height="40" rx="4" fill="#1d2a30"/>
          <text x="545" y="514" font-size="11" text-anchor="middle" fill="#cfd6dc" font-family="IBM Plex Mono">ATmega328P</text>
          <text x="760" y="545" font-size="15" text-anchor="end" fill="#e8f1f4" font-family="Archivo" font-weight="800">Arduino UNO</text>
        </g>
        <g id="parts"></g>
        <g id="targets"></g>
      </svg>
    </div>
  </div>

  <div class="side">
    <div class="card" id="stepCard" aria-live="polite">
      <div class="stepno" id="stepNo">Paso 0 de 12</div>
      <h2 id="stepTitle"></h2>
      <div class="conn" id="conn"></div>
      <p class="desc" id="stepDesc"></p>
      <div class="tip" id="stepTip"></div>
      <div class="nav"><button class="btn" id="prev" type="button">← Anterior</button><button class="btn primary" id="next" type="button">Siguiente →</button></div>
      <div class="progress"><span id="prog"></span></div>
    </div>
    <div class="card">
      <div class="listhead">Todos los pasos</div>
      <ol class="list" id="list"></ol>
    </div>
  </div>
</div></main>

<script>
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
const cx=c=>80+(c-1)*25;                 // columna 1..30
const ROWS={A:110,B:130,C:150,D:170,E:190,F:256,G:276,H:296,I:316};
const PIN={'5V':175,'GND':215,'D13':395,'D12':425,'D11':455,'D10':485,'D9':515,'D8':545,'D7':585,'D6':615,'D5':645,'D4':675,'D3':705,'D2':735};
const PY=432;

/* Agujeros, etiquetas y cabecera */
let h='';
for(let c=1;c<=30;c++){for(const r of 'ABCDEFGHI')h+=`<rect x="${cx(c)-3.5}" y="${ROWS[r]-3.5}" width="7" height="7" rx="1.5" fill="#c3cbd0"/>`;
  h+=`<rect x="${cx(c)-3.5}" y="52.5" width="7" height="7" rx="1.5" fill="#c3cbd0"/><rect x="${cx(c)-3.5}" y="80.5" width="7" height="7" rx="1.5" fill="#c3cbd0"/>`}
$('#holes').innerHTML=h;
let lb='';[1,5,10,15,20,25,30].forEach(c=>lb+=`<text x="${cx(c)}" y="104" text-anchor="middle">${c}</text>`);
'ABCDEFGHI'.split('').forEach(r=>lb+=`<text x="62" y="${ROWS[r]+3}" text-anchor="middle">${r}</text>`);
$('#labels').innerHTML=lb;
let hd='';Object.entries(PIN).forEach(([k,x])=>hd+=`<rect x="${x-6}" y="${PY-6}" width="12" height="12" fill="#14212b"/><text x="${x}" y="${PY+22}" font-size="10" text-anchor="middle" fill="#e8f1f4" font-family="IBM Plex Mono">${k}</text>`);
$('#header').innerHTML=hd+`<text x="195" y="474" font-size="9" text-anchor="middle" fill="#a8d3d8" font-family="IBM Plex Mono">POWER</text><text x="565" y="474" font-size="9" text-anchor="middle" fill="#a8d3d8" font-family="IBM Plex Mono">DIGITAL</text>`;

/* Constructores de piezas */
const wire=(x1,y1,x2,y2,col,bend)=>{const b=bend??Math.max(60,Math.abs(y2-y1)*.45);
  return `<path class="wirepath" stroke="#00000033" stroke-width="7" d="M${x1} ${y1} C${x1} ${y1+(y2>y1?b:-b)}, ${x2} ${y2-(y2>y1?b:-b)}, ${x2} ${y2}" transform="translate(1.5,2)"/>
  <path class="wirepath" stroke="${col}" d="M${x1} ${y1} C${x1} ${y1+(y2>y1?b:-b)}, ${x2} ${y2-(y2>y1?b:-b)}, ${x2} ${y2}"/>
  <circle cx="${x1}" cy="${y1}" r="4.5" fill="${col}" stroke="#14212b"/><circle cx="${x2}" cy="${y2}" r="4.5" fill="${col}" stroke="#14212b"/>`};
const railWire=(px,col,railY,side)=>{ // desde el Arduino, rodeando la protoboard por la izquierda
  const x=side;return `<path class="wirepath" stroke="${col}" d="M${px} ${PY} C${px} 380, ${x} 390, ${x} 330 L${x} ${railY+18} C${x} ${railY}, ${x+10} ${railY}, ${cx(1)} ${railY}"/>
  <circle cx="${px}" cy="${PY}" r="4.5" fill="${col}" stroke="#14212b"/><circle cx="${cx(1)}" cy="${railY}" r="4.5" fill="${col}" stroke="#14212b"/>`};
const resistor=(c)=>{const x=cx(c);return `<line x1="${x}" y1="${ROWS.A}" x2="${x}" y2="84" stroke="#8a949a" stroke-width="2"/>
  <rect x="${x-5}" y="89" width="10" height="17" rx="4" fill="#d9c08a" stroke="#8a7650"/>
  <rect x="${x-5}" y="92" width="10" height="2.5" fill="#c0392b"/><rect x="${x-5}" y="96.5" width="10" height="2.5" fill="#c0392b"/><rect x="${x-5}" y="101" width="10" height="2.5" fill="#6b3d1f"/>
  <circle cx="${x}" cy="84" r="3.5" fill="#8a949a"/><circle cx="${x}" cy="${ROWS.A}" r="3.5" fill="#8a949a"/>`};
const led=(c,col)=>{const a=cx(c),k=cx(c+1),m=(a+k)/2;return `<line x1="${a}" y1="${ROWS.E}" x2="${a}" y2="176" stroke="#8a949a" stroke-width="2.5"/><line x1="${k}" y1="${ROWS.E}" x2="${k}" y2="180" stroke="#8a949a" stroke-width="2.5"/>
  <path d="M${m-12} 178 v-14 a12 12 0 0 1 24 0 v14 z" fill="${col}" stroke="#00000055"/><rect x="${m-14}" y="176" width="28" height="4" rx="1" fill="${col}"/>
  <text x="${a}" y="210" font-size="10" text-anchor="middle" fill="#14212b" font-family="IBM Plex Mono" font-weight="600">+</text><text x="${k}" y="210" font-size="10" text-anchor="middle" fill="#14212b" font-family="IBM Plex Mono" font-weight="600">−</text>
  <circle cx="${a}" cy="${ROWS.E}" r="3.5" fill="#8a949a"/><circle cx="${k}" cy="${ROWS.E}" r="3.5" fill="#8a949a"/>`};

/* Pasos: cada uno dibuja sus piezas */
const C={red:'#d93b3b',blk:'#1d1d1d',yel:'#e0a400',blu:'#2f6fd6',grn:'#22a35a',pur:'#7a4fd0'};
const steps=[
 {t:'Prepara la mesa',from:'',to:'',col:null,d:'Coloca la protoboard y el Arduino UNO uno al lado del otro. Ten a mano los cables: rojo, negro, amarillo, azul y otros para los LEDs.',tip:'Trabaja siempre con el cable USB desconectado. Solo se conecta en la revisión final.',warn:true,svg:'',pin:[]},
 {t:'5V del Arduino al riel +',from:'Arduino 5V',to:'Riel + (rojo)',col:C.red,d:'Un cable rojo lleva los 5 voltios del Arduino a la línea roja (+) de la protoboard. Todo lo que conectes a ese riel recibe energía.',tip:'El riel + recorre toda la protoboard de lado a lado.',svg:railWire(PIN['5V'],C.red,56,24),pin:['5V']},
 {t:'GND del Arduino al riel −',from:'Arduino GND',to:'Riel − (azul)',col:C.blk,d:'Un cable negro une el pin GND del Arduino con la línea azul (−). Es la tierra común de todo el circuito.',tip:'Sin GND compartido nada funciona: el circuito necesita un camino de regreso.',svg:railWire(PIN.GND,C.blk,84,32),pin:['GND']},
 {t:'Inserta el sensor HC-SR04',from:'HC-SR04',to:'Columnas 1–4, fila E',col:C.blu,d:'Pon el sensor en el borde de la protoboard con sus cuatro pines en la fila E, uno por columna: VCC en la 1, TRIG en la 2, ECHO en la 3 y GND en la 4.',tip:'Los "ojos" del sensor miran hacia afuera, sin nada delante. Cada pin debe quedar en su propia columna.',
  svg:`<rect x="${cx(1)-18}" y="196" width="${cx(4)-cx(1)+36}" height="22" rx="4" fill="#2f6fd6"/>
   <circle cx="${cx(1)+8}" cy="226" r="14" fill="#cfd6dc" stroke="#7d8a94" stroke-width="3"/><circle cx="${cx(4)-8}" cy="226" r="14" fill="#cfd6dc" stroke="#7d8a94" stroke-width="3"/>
   ${[1,2,3,4].map(c=>`<line x1="${cx(c)}" y1="${ROWS.E}" x2="${cx(c)}" y2="198" stroke="#8a949a" stroke-width="2.5"/><circle cx="${cx(c)}" cy="${ROWS.E}" r="3.5" fill="#8a949a"/>`).join('')}
   <g font-family="IBM Plex Mono" font-size="8" fill="#fff" text-anchor="middle"><text x="${cx(1)}" y="211">VCC</text><text x="${cx(2)}" y="211">TRIG</text><text x="${cx(3)}" y="211">ECHO</text><text x="${cx(4)}" y="211">GND</text></g>`,pin:[]},
 {t:'VCC del sensor al riel +',from:'VCC (col. 1)',to:'Riel +',col:C.red,d:'Desde la columna 1 (fila C) un cable rojo corto sube al riel +. Así el sensor recibe 5 V.',tip:'Los cinco agujeros de la columna 1 (A–E) están unidos, por eso el cable puede ir en la fila C.',svg:wire(cx(1),ROWS.C,cx(2),56,C.red,30),pin:[]},
 {t:'GND del sensor al riel −',from:'GND (col. 4)',to:'Riel −',col:C.blk,d:'Desde la columna 4 (fila C) un cable negro va al riel −.',tip:'Revisa que no hayas usado la columna de TRIG o ECHO por error.',svg:wire(cx(4),ROWS.C,cx(5),84,C.blk,25),pin:[]},
 {t:'TRIG al pin D9',from:'TRIG (col. 2)',to:'Arduino D9',col:C.yel,d:'Un cable amarillo une la columna 2 con el pin digital 9. Por aquí el Arduino envía el pulso de 10 µs que dispara el sonido.',tip:'D9 se configura como OUTPUT en el código.',svg:wire(cx(2),ROWS.B,PIN.D9,PY,C.yel,170),pin:['D9']},
 {t:'ECHO al pin D10',from:'ECHO (col. 3)',to:'Arduino D10',col:C.blu,d:'Un cable azul une la columna 3 con el pin digital 10. Por aquí vuelve el pulso cuya duración es el tiempo del eco.',tip:'Si cruzas TRIG y ECHO, el monitor siempre marcará 400 cm.',svg:wire(cx(3),ROWS.A,PIN.D10,PY,C.blu,190),pin:['D10']},
 {t:'LED verde al pin D4',from:'LED verde (+)',to:'Arduino D4',col:C.grn,many:true,d:'Pata larga (+) del LED en la columna 12 y pata corta (−) en la 13, ambas en la fila E. Una resistencia de 220 Ω va de la columna 13 (fila A) al riel −. Un cable verde une la columna 12 con D4.',tip:'Resistencia de 220 Ω: bandas rojo-rojo-marrón. Protege el LED de quemarse.',svg:led(12,'#2fbf6a')+resistor(13)+wire(cx(12),ROWS.C,PIN.D4,PY,C.grn,150),pin:['D4']},
 {t:'LED amarillo al pin D5',from:'LED amarillo (+)',to:'Arduino D5',col:C.yel,many:true,d:'Pata larga en la columna 17, pata corta en la 18. Resistencia de 220 Ω de la columna 18 al riel −. Cable de la columna 17 a D5.',tip:'La pata larga siempre va hacia el pin del Arduino.',svg:led(17,'#f2b705')+resistor(18)+wire(cx(17),ROWS.C,PIN.D5,PY,'#c98f00',150),pin:['D5']},
 {t:'LED rojo al pin D6',from:'LED rojo (+)',to:'Arduino D6',col:C.red,many:true,d:'Pata larga en la columna 22, pata corta en la 23. Resistencia de 220 Ω de la columna 23 al riel −. Cable de la columna 22 a D6.',tip:'Este LED indica que el objeto está a 10 cm o menos.',svg:led(22,'#e04848')+resistor(23)+wire(cx(22),ROWS.C,PIN.D6,PY,C.red,150),pin:['D6']},
 {t:'Buzzer al pin D7',from:'Buzzer (+) col. 28',to:'Arduino D7',col:C.pur,many:true,d:'Coloca el buzzer con su terminal (+) en la columna 28 y el (−) en la 30. Un cable morado une la columna 28 con D7 y un cable negro lleva la columna 30 al riel −.',tip:'Fíjate en el símbolo + impreso sobre el buzzer.',
  svg:`<line x1="${cx(28)}" y1="${ROWS.E}" x2="${cx(28)}" y2="185" stroke="#8a949a" stroke-width="2.5"/><line x1="${cx(30)}" y1="${ROWS.E}" x2="${cx(30)}" y2="185" stroke="#8a949a" stroke-width="2.5"/>
   <circle cx="${cx(29)}" cy="178" r="20" fill="#1d1d1d" stroke="#444" stroke-width="2"/><circle cx="${cx(29)}" cy="178" r="4" fill="#444"/>
   <text x="${cx(28)-6}" y="${ROWS.E+20}" font-size="10" fill="#14212b" font-family="IBM Plex Mono" font-weight="600">+</text>
   ${wire(cx(28),ROWS.B,PIN.D7,PY,C.pur,170)}${wire(cx(30),ROWS.B,cx(30),84,C.blk,20)}`,pin:['D7']},
 {t:'Revisión final',from:'',to:'',col:null,check:true,d:'Compara cada cable con esta lista antes de conectar el USB. Cuando todo esté marcado, conecta el cable, sube el código y abre el Monitor Serie a 9600 baudios.',tip:'Acerca la mano al sensor: la distancia debe cambiar y los LEDs pasar de verde a amarillo y a rojo.',svg:'',pin:[]}
];
const checkItems=['5V → riel + y GND → riel −','Sensor en columnas 1–4, cada pin en su columna','VCC al riel + y GND al riel −','TRIG → D9 y ECHO → D10 (no cruzados)','Pata larga de cada LED hacia el pin D4, D5 o D6','Cada LED con su resistencia de 220 Ω al riel −','Buzzer (+) → D7 y (−) → riel GND'];

/* Dibujar todas las piezas una vez */
const parts=$('#parts');
steps.forEach((s,i)=>{const g=document.createElementNS(NS,'g');g.setAttribute('class','el future');g.dataset.i=i;g.innerHTML=s.svg;parts.appendChild(g)});
// Las piezas (LEDs, sensor, buzzer) quedan por encima de los cables largos de pasos anteriores
const tg=$('#targets');Object.entries(PIN).forEach(([k,x])=>tg.insertAdjacentHTML('beforeend',`<circle class="target" data-p="${k}" cx="${x}" cy="${PY}" r="13"/>`));

/* Lista lateral */
$('#list').innerHTML=steps.map((s,i)=>`<li><button type="button" data-i="${i}"><span class="n">${i}</span><span>${s.t}</span><span class="sw" style="background:${s.col||'transparent'}"></span></button></li>`).join('');

let cur=0;try{cur=Math.min(+localStorage.getItem('paso')||0,steps.length-1)}catch(e){}
let checked=[];
function render(){
  const all=$('#showAll').checked;
  document.querySelectorAll('#parts .el').forEach(g=>{const i=+g.dataset.i;
    g.setAttribute('class','el '+(all?'past':i<cur?'past':i===cur?'now':'future'))});
  $('#svg').classList.toggle('dim',$('#dimOld').checked);
  document.querySelectorAll('.target').forEach(t=>t.classList.toggle('on',!all&&steps[cur].pin.includes(t.dataset.p)));
  const s=steps[cur];
  $('#stepNo').textContent=`Paso ${cur} de ${steps.length-1}`;
  $('#stepTitle').textContent=s.t;
  const conn=$('#conn');
  if(s.from){conn.hidden=false;conn.style.setProperty('--wc',s.col);
    conn.innerHTML=`<span class="end from">${s.from}</span><span class="wire"></span><span class="end">${s.to}</span>`}
  else if(s.check){conn.hidden=false;conn.className='conn many';
    conn.innerHTML='<div class="checks">'+checkItems.map((c,i)=>`<label><input type="checkbox" id="chk${i}" data-i="${i}" ${checked.includes(i)?'checked':''}><span>${c}</span></label>`).join('')+'</div>'}
  else{conn.hidden=true}
  if(s.from)conn.className='conn';
  $('#stepDesc').textContent=s.d;
  const tip=$('#stepTip');tip.textContent=s.tip;tip.className='tip'+(s.warn?' warn':'');
  $('#prev').disabled=cur===0;$('#next').textContent=cur===steps.length-1?'Volver al inicio':'Siguiente →';
  $('#prog').style.width=cur/(steps.length-1)*100+'%';
  document.querySelectorAll('#list button').forEach(b=>{const i=+b.dataset.i;
    b.toggleAttribute('aria-current',false);if(i===cur)b.setAttribute('aria-current','step');b.classList.toggle('past',i<cur)});
  try{localStorage.setItem('paso',cur)}catch(e){}
}
function go(i){cur=Math.max(0,Math.min(steps.length-1,i));if($('#showAll').checked)$('#showAll').checked=false;render()}
$('#prev').onclick=()=>go(cur-1);
$('#next').onclick=()=>go(cur===steps.length-1?0:cur+1);
$('#list').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
$('#showAll').onchange=render;$('#dimOld').onchange=render;
$('#conn').addEventListener('change',e=>{const i=+e.target.dataset.i;checked=e.target.checked?[...checked,i]:checked.filter(x=>x!==i);
  if(checked.length===checkItems.length)$('#stepTip').textContent='¡Todo revisado! Ya puedes conectar el USB y subir el código.'});
document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
render();
</script>
</body>
</html>
